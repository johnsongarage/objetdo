<script>
    // 화면 테마(설정 > 화면): 종이·밤·개나리를 골랐으면 그림을 그리기 전에 붙인다 — 자동이면 그대로 두어 기기 설정을 따른다 (settings.js applyTheme과 같은 값)
    try {
        var th = localStorage.getItem('v2Theme');
        if (th === 'dark' || th === 'light' || th === 'yellow') { document.documentElement.setAttribute('data-theme', th); var mc = document.querySelectorAll('meta[name="theme-color"]'); for (var mi = 0; mi < mc.length; mi++) mc[mi].content = th === 'dark' ? '#1E1B18' : th === 'yellow' ? '#FFD93A' : '#F5F1EA'; }
        // 아이폰 홈 화면 앱 맨 위 상태 표시줄: 어두우면 검은 띠·흰 글자 (default는 밝은 띠라 어두운 화면 위에 흰 줄이 생긴다)
        var dk = th === 'dark' || (th !== 'light' && th !== 'yellow' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches), sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (sb && dk) sb.content = 'black';
    } catch (e) {}
    // v2 1단계 (찾기 화면). 데이터는 v1과 같은 곳·같은 모양을 그대로 쓴다 — 새로 저장하는 형식이 없다.
    // 주소 ?mode=home|store, ?sample=store|home 는 v1과 같은 뜻 (예시 상태도 v1과 같은 sessionStorage 'samplePreview'를 같이 쓴다)
    (function () {
        try {
            var u = new URLSearchParams(location.search), m = u.get('mode'), s = u.get('sample'), saved = localStorage.getItem('useMode');
            // 예시 링크(?sample=…)는 이미 쓰는 곳이 정해진 폰의 모드를 바꾸지 않는다 (11/12: 인스타·홈페이지 '예시 집' 링크를 매장 사장님이 눌러도 매장 그대로) — 처음 온 폰만 그 모드로 정한다
            if ((m === 'home' || m === 'store') && !(s && saved)) localStorage.setItem('useMode', m);
            if (s) {
                var home = s === 'home' || s === 'organizer' || (s !== 'store' && (m ? m === 'home' : localStorage.getItem('useMode') === 'home'));
                sessionStorage.setItem('samplePreview', home ? 'organizer' : '1');
            }
            if (m || s) { u.delete('mode'); u.delete('sample'); history.replaceState(history.state, '', location.pathname + (u.toString() ? '?' + u : '') + location.hash); }
            var sp = sessionStorage.getItem('samplePreview'); // 예시를 보는 동안은 그 예시의 모드로 보여 준다 (저장된 모드는 그대로 · 예시를 닫으면 돌아온다)
            document.documentElement.dataset.mode = sp ? (sp === 'organizer' ? 'home' : 'store') : (localStorage.getItem('useMode') === 'home' ? 'home' : 'store');
        } catch (e) { document.documentElement.dataset.mode = 'store'; }
    })();
</script>
