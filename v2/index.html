<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F1EA">
<title>오브젯도 · 새 화면 미리보기</title>
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<script>
    // v2 1단계 (찾기 화면). 데이터는 v1과 같은 곳·같은 모양을 그대로 쓴다 — 새로 저장하는 형식이 없다.
    // 주소 ?mode=home|store, ?sample=store|home 는 v1과 같은 뜻 (예시 상태도 v1과 같은 sessionStorage 'samplePreview'를 같이 쓴다)
    (function () {
        try {
            var u = new URLSearchParams(location.search), m = u.get('mode'), s = u.get('sample');
            if (m === 'home' || m === 'store') localStorage.setItem('useMode', m);
            if (s) {
                var home = s === 'home' || s === 'organizer' || (s !== 'store' && localStorage.getItem('useMode') === 'home');
                sessionStorage.setItem('samplePreview', home ? 'organizer' : '1');
            }
            if (m || s) { u.delete('mode'); u.delete('sample'); history.replaceState(history.state, '', location.pathname + (u.toString() ? '?' + u : '') + location.hash); }
            document.documentElement.dataset.mode = localStorage.getItem('useMode') === 'home' ? 'home' : 'store';
        } catch (e) { document.documentElement.dataset.mode = 'store'; }
    })();
</script>
<style>
    :root {
        --bg: #F5F1EA; --sheet: #FBF8F3; --ink: #3A3530; --sub: #6E665C; --mute: #8C8378;
        --line: #D9D0C2; --line2: #E3DBCE; --accent: #9E3B2A; --accent-soft: #F3E3DC; --hl: #ECE5D9;
        --serif: 'Gowun Batang', 'Nanum Myeongjo', 'AppleMyungjo', serif;
        --sans: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        --gut: 24px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; background: var(--bg); }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-tap-highlight-color: transparent; word-break: keep-all; overflow-wrap: anywhere; }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    .screen { display: none; flex: 1; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
    .screen.on { display: flex; }
    .boot { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 15px; }

    /* 위 띠 */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding: calc(4px + env(safe-area-inset-top)) 12px 0 var(--gut); }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 20px; font-weight: 700; white-space: nowrap; }
    .brand::before { content: ''; flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
    .brand small { font-family: var(--sans); font-size: 12px; font-weight: 400; letter-spacing: .22em; color: var(--sub); }
    .tlink { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border: 0; background: none; font-size: 15px; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; white-space: nowrap; }
    .back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; margin-left: -6px; padding: 0 12px 0 0; border: 0; background: none; font-size: 15px; cursor: pointer; white-space: nowrap; }
    .back svg { width: 20px; height: 20px; }
    .meta { font-size: 13px; color: var(--sub); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 12px; }
    .wrap { padding: 0 var(--gut); }
    .strip { margin: 6px var(--gut) 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 42px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--sub); }
    .strip a, .strip button { display: inline-flex; align-items: center; min-height: 40px; border: 0; background: none; padding: 0; color: var(--accent); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; white-space: nowrap; }
    .kick { font-size: 13px; letter-spacing: .08em; color: var(--sub); }
    .ext { font-size: .85em; }

    /* 버튼 */
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; padding: 0 18px; border: 1px solid var(--ink); border-radius: 2px; font-size: 16px; font-weight: 500; text-decoration: none; cursor: pointer; text-align: center; }
    .btn-p { background: var(--ink); color: #FBF8F3; }
    .btn-s { background: transparent; color: var(--ink); }
    .btn.split { justify-content: space-between; padding: 0 20px; text-align: left; }
    .btn:disabled { opacity: .4; cursor: default; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .rows { display: flex; flex-direction: column; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 54px; padding: 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); font-size: 16px; text-align: left; text-decoration: none; cursor: pointer; }
    .row .ar { flex: none; color: var(--sub); }
    .row small { color: var(--accent); font-size: 13px; margin-left: 6px; }

    /* 검색 홈 */
    .home { flex: 1; display: flex; flex-direction: column; gap: 30px; padding-top: 34px; }
    .ask { display: block; font-family: var(--serif); font-size: 28px; font-weight: 700; line-height: 1.3; margin-bottom: 16px; }
    .sbox { display: flex; align-items: center; gap: 10px; border-bottom: 1.5px solid var(--ink); color: var(--sub); }
    .sbox svg { flex: none; width: 21px; height: 21px; }
    .sbox input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 19px; color: var(--ink); padding: 10px 0 12px; -webkit-appearance: none; appearance: none; border-radius: 0; }
    .sbox input::placeholder { color: #A69C8E; }
    .sbox input::-webkit-search-cancel-button { display: none; }
    .sclear { flex: none; width: 40px; height: 40px; border: 0; background: none; color: var(--sub); font-size: 22px; cursor: pointer; }
    .voice-row { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
    .mic { flex: none; width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--accent); background: none; color: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .mic svg { width: 23px; height: 23px; }
    .voice-row b { display: block; font-weight: 500; font-size: 16px; }
    .voice-row span { display: block; font-size: 14px; color: var(--sub); }
    .live { margin-top: 6px; }
    .hit { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 62px; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
    .hn { flex: none; min-width: 30px; font-family: var(--serif); font-size: 26px; line-height: 1; color: var(--accent); }
    .hb { flex: 1; min-width: 0; }
    .hb b { display: block; font-weight: 500; font-size: 17px; }
    .hb small { display: block; font-size: 13px; color: var(--sub); }
    .ht { flex: none; font-size: 12px; color: var(--accent); border: 1px solid currentColor; padding: 1px 6px; border-radius: 2px; white-space: nowrap; }
    mark { background: var(--accent-soft); color: inherit; padding: 0 1px; }
    .none { margin: 18px 0 6px; font-size: 16px; }
    .none + .row { border-top: 1px solid var(--line); }
    .more-note { font-size: 13px; color: var(--sub); margin: 10px 0 0; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .stat { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px 0 14px 16px; border: 0; border-left: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
    .stat:first-child { border-left: 0; padding-left: 0; }
    .stat span { font-size: 13px; letter-spacing: .1em; color: var(--sub); }
    .stat b { font-family: var(--serif); font-size: 28px; font-weight: 400; line-height: 1.2; }
    .stat.warn b { color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip { display: inline-flex; align-items: center; min-height: 44px; padding: 0 15px; border: 1px solid var(--ink); border-radius: 2px; background: none; font-size: 15px; cursor: pointer; }
    .foot { padding: 22px var(--gut) 22px; font-size: 13px; color: var(--sub); }
    .foot a { color: var(--accent); text-underline-offset: 3px; }
    .foot.center { text-align: center; }

    /* 사진 + 칸 */
    .ph { position: relative; overflow: hidden; background: var(--hl); border: 1px solid var(--ink); margin: 0 auto; width: min(100%, calc(58vh * var(--ar))); aspect-ratio: var(--ar); }
    @supports not (aspect-ratio: 1) { .ph::before { content: ''; display: block; padding-top: calc(100% / var(--ar)); } }
    .ph-in { position: absolute; inset: 0; transform-origin: 0 0; transition: transform .45s cubic-bezier(.2, .7, .2, 1); --k: 1; }
    .ph img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .zn { position: absolute; margin: 0; padding: 0; background: transparent; border: calc(1.5px * var(--k)) solid rgba(251, 248, 243, .95); box-shadow: 0 0 0 calc(1px * var(--k)) rgba(58, 53, 48, .55); font: inherit; color: var(--ink); }
    button.zn { cursor: pointer; }
    .zn b { position: absolute; left: 0; top: 0; min-width: calc(24px * var(--k)); height: calc(24px * var(--k)); padding: 0 calc(5px * var(--k)); display: flex; align-items: center; justify-content: center; background: var(--sheet); color: var(--ink); font-family: var(--serif); font-size: calc(15px * var(--k)); font-weight: 700; line-height: 1; }
    .zn i { position: absolute; right: calc(3px * var(--k)); top: calc(3px * var(--k)); padding: calc(1px * var(--k)) calc(5px * var(--k)); font-style: normal; font-size: calc(11px * var(--k)); line-height: 1.4; background: var(--accent); color: #fff; white-space: nowrap; }
    .zn.dim { border-color: rgba(251, 248, 243, .55); box-shadow: none; }
    .zn.dim b { display: none; }
    .zn.hit { border: calc(3px * var(--k)) solid var(--accent); box-shadow: 0 0 0 9999px rgba(36, 30, 26, .46); z-index: 3; animation: pulse 1.5s ease-out 2; }
    .zn.hit b { background: var(--accent); color: #fff; }
    .zn.from { border: calc(2px * var(--k)) dashed var(--accent); box-shadow: 0 0 0 calc(1px * var(--k)) rgba(251, 248, 243, .8); }
    .zn.from b { color: var(--accent); }
    .zn.sel { border: calc(3.5px * var(--k)) solid var(--ink); background: rgba(251, 248, 243, .28); box-shadow: 0 0 0 calc(2px * var(--k)) #fff; z-index: 3; }
    .zn.sel b { background: var(--ink); color: #fff; }
    .zn.sel i { background: var(--ink); }
    @keyframes pulse { 0% { outline: 0 solid rgba(158, 59, 42, .7); } 100% { outline: calc(18px * var(--k)) solid rgba(158, 59, 42, 0); } }
    .ph-tools { display: flex; justify-content: flex-end; }
    .ph-tools .tlink { font-size: 14px; padding-right: 0; }
    .ptabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gut)) 14px; padding: 0 var(--gut); }
    .ptabs::-webkit-scrollbar { display: none; }
    .ptabs button { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 0; border-bottom: 1px solid var(--line); background: none; font-size: 15px; color: var(--sub); cursor: pointer; white-space: nowrap; }
    .ptabs button span { font-family: var(--serif); color: var(--accent); }
    .ptabs button[aria-selected="true"] { color: var(--ink); border-bottom: 2px solid var(--ink); font-weight: 500; }

    /* 찾은 결과 */
    .ans { display: flex; align-items: flex-end; gap: 16px; margin-top: 26px; }
    .ans-n { font-family: var(--serif); font-size: 78px; line-height: .86; color: var(--accent); }
    .ans-t { min-width: 0; padding-bottom: 2px; }
    .ans-t small { display: block; font-size: 14px; color: var(--sub); }
    .ans-t b { display: block; font-family: var(--serif); font-size: 27px; font-weight: 700; line-height: 1.25; }
    .where { margin: 20px 0 0; font-size: 17px; }
    .facts { margin: 12px 0 22px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
    .facts li { display: flex; gap: 12px; }
    .facts .k { flex: none; min-width: 44px; font-size: 13px; line-height: 1.75; color: var(--sub); }
    .facts .why { color: var(--accent); }
    .with { display: flex; gap: 14px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 15px; }
    .with .k { flex: none; font-size: 13px; line-height: 1.75; color: var(--sub); }
    .others { margin-top: 34px; padding-bottom: 12px; }
    .others .hit { min-height: 54px; }
    .others .hn { font-size: 22px; }
    .cta { margin-top: auto; padding: 30px 0 4px; display: flex; flex-direction: column; gap: 10px; }
    .cta .kick { letter-spacing: .02em; margin-bottom: 2px; }
    .cta .tlink { align-self: center; color: var(--accent); }
    .zitems { margin: 0; padding: 0; list-style: none; }
    .zitems li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
    .zitems li small { color: var(--sub); font-size: 13px; text-align: right; }
    .empty { color: var(--sub); font-size: 15px; margin: 20px 0; }

    /* 수납 지도 */
    .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 22px 0 16px; }
    .h1 { margin: 0; font-family: var(--serif); font-size: 27px; font-weight: 700; line-height: 1.3; min-width: 0; }
    .title-row .meta { padding-right: 0; flex: none; }
    .links { display: flex; flex-wrap: wrap; gap: 4px 22px; margin: 18px 0 8px; }
    .links a, .links button { display: inline-flex; align-items: center; min-height: 44px; padding: 0; border: 0; background: none; font-size: 15px; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
    .zt-head { display: flex; justify-content: space-between; margin-top: 18px; padding-bottom: 8px; border-bottom: 1px solid var(--ink); font-size: 13px; letter-spacing: .06em; color: var(--sub); }
    .zrow { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 58px; padding: 8px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
    .zrow .n { flex: none; min-width: 22px; font-family: var(--serif); font-size: 19px; color: var(--sub); }
    .zrow .t { flex: 1; min-width: 0; font-size: 16px; }
    .zrow .t small { display: block; font-size: 13px; color: var(--sub); }
    .zrow .d { flex: none; font-size: 14px; color: var(--sub); }
    .zrow .d.warn { color: var(--accent); }
    .morebtn { align-self: flex-start; min-height: 44px; padding: 0; border: 0; background: none; color: var(--accent); font-size: 15px; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }

    /* 목록 */
    .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
    .tabs button { min-height: 46px; padding: 0 2px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; font-size: 16px; color: var(--sub); cursor: pointer; }
    .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
    .li { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 6px 0; border: 0; border-bottom: 1px solid var(--line2); background: none; text-align: left; cursor: pointer; }
    .li .lg { flex: none; width: 20px; font-size: 14px; color: var(--accent); }
    .li .ln { flex: 1; min-width: 0; font-size: 16px; }
    .li .lz { flex: none; max-width: 48%; font-size: 14px; color: var(--sub); text-align: right; }
    .li .lz small { font-size: 12px; }
    .lh { margin: 26px 0 0; padding-bottom: 8px; border-bottom: 1px solid var(--ink); font-family: var(--serif); font-size: 20px; }
    .lzh { display: flex; gap: 10px; align-items: baseline; margin-top: 14px; padding: 6px 0; font-size: 14px; color: var(--sub); }
    .lzh b { font-family: var(--serif); font-size: 17px; color: var(--accent); font-weight: 400; }

    /* 메뉴 */
    .menu { margin-top: 18px; padding: 0; list-style: none; }
    .mi { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 68px; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; text-decoration: none; color: var(--ink); cursor: pointer; }
    .mi .no { flex: none; width: 26px; font-family: var(--serif); font-size: 15px; color: var(--accent); }
    .mi .tx { flex: 1; min-width: 0; }
    .mi .tx b { display: block; font-size: 17px; font-weight: 500; }
    .mi .tx small { display: block; font-size: 13px; color: var(--sub); }
    .mi .ar { flex: none; color: var(--sub); }

    /* 첫 소개 */
    .intro { flex: 1; display: flex; flex-direction: column; padding-top: 34px; }
    .intro-hero { position: relative; margin-top: 12px; }
    .intro h1 { margin: 0; font-family: var(--serif); font-size: 31px; font-weight: 700; line-height: 1.45; }
    .vert { position: absolute; right: 0; top: 4px; writing-mode: vertical-rl; white-space: nowrap; font-family: var(--serif); font-size: 20px; letter-spacing: .28em; color: var(--accent); }
    .intro h1 { padding-right: 44px; }
    .lead { margin: 18px 0 0; font-size: 15px; line-height: 1.7; color: var(--sub); }
    .nums { margin: 30px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
    .nums li { display: flex; gap: 18px; align-items: center; min-height: 52px; border-bottom: 1px solid var(--line); font-size: 16px; }
    .nums li span { flex: none; width: 22px; font-family: var(--serif); font-size: 14px; color: var(--accent); }
    .intro .cta { padding-top: 40px; }
    .fine { margin: 14px 0 0; font-size: 13px; line-height: 1.7; color: var(--sub); }
    .fine a { color: var(--accent); text-underline-offset: 3px; }

    /* 말로 찾기 */
    .voice { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 var(--gut); }
    .vc { position: relative; flex: none; width: 236px; height: 236px; margin-top: 44px; padding: 0; border: 0; background: none; cursor: pointer; }
    .vc .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--line2); }
    .vc .r2 { inset: 30px; border-color: var(--line); }
    .vc .core { position: absolute; inset: 60px; border-radius: 50%; background: var(--sheet); border: 1px solid var(--accent); color: var(--accent); display: flex; align-items: center; justify-content: center; }
    .vc .core svg { width: 34px; height: 34px; }
    .is-listening .vc .ring { animation: ring 2.2s ease-out infinite; }
    .is-listening .vc .r2 { animation-delay: .5s; }
    .is-listening .vc .core { background: var(--accent); color: #fff; }
    @keyframes ring { 0% { transform: scale(.82); opacity: 1; } 100% { transform: scale(1.06); opacity: 0; } }
    .voice h1 { margin: 30px 0 0; font-family: var(--serif); font-size: 27px; font-weight: 700; }
    .voice .vsub { margin: 6px 0 0; font-size: 15px; color: var(--sub); }
    .vheard { align-self: stretch; margin-top: 26px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .vheard .kick { color: var(--accent); }
    .vheard .kick::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--accent); vertical-align: 2px; }
    .vheard b { display: block; margin-top: 6px; font-family: var(--serif); font-size: 25px; font-weight: 700; }
    .vheard small { display: block; margin-top: 4px; font-size: 14px; color: var(--sub); }
    .vacts { align-self: stretch; display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }

    /* 옮기기 */
    .mv-from { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 18px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 17px; color: var(--sub); text-align: center; }
    .mv-from b { font-family: var(--serif); font-size: 21px; color: var(--ink); }
    .mv-list { margin-top: 8px; }
    .mv-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 4px; font-size: 13px; color: var(--sub); }
    .mv-foot .tlink { padding-left: 0; color: var(--ink); }

    /* 알림·시트 */

    const zones = order.map(i => {

        const el = o.tap ? 'button' : 'span';

        <main class="wrap" style="flex:1;display:flex;flex-direction:column;padding-bottom:20px">
            <span class="kick" style="margin-top:20px">${esc(mv.name)} · 자리 옮기기</span>
            <h1 class="h1" style="margin:6px 0 4px">어느 칸이에요?</h1>
            <p style="margin:0 0 18px;font-size:15px;color:var(--sub)">사진에서 실제로 있던 칸을 눌러 주세요.</p>
            ${photoTabs(view.id, 'mvView')}
            ${photoHTML(view, { tap: 'mvPick', from: sameView ? mv.zi : null, sel: toHere ? mv.to.zi : null })}
            <div class="mv-from"><span>${esc(label(from, mv.zi))}</span><span aria-hidden="true">→</span>${to ? `<b>${esc(label(to, mv.to.zi))}</b>` : '<span>?</span>'}</div>
            <div class="cta" style="padding-top:24px">
                <button type="button" class="btn btn-p" data-act="mvGo"${to ? '' : ' disabled'}>${to ? `${esc(label(to, mv.to.zi))}${esc(josa(label(to, mv.to.zi), '으로', '로').slice(label(to, mv.to.zi).length))} 옮기기` : '칸을 먼저 눌러 주세요'}</button>
                <button type="button" class="btn btn-s" data-act="mvList" aria-expanded="${mv.list}">${mv.list ? '목록 닫기' : '목록에서 고르기'}</button>
                ${zlist}
                <div class="mv-foot"><button type="button" class="tlink" data-act="mvLost">찾을 수 없어요</button><span>잘못 옮기면 되돌릴 수 있어요</span></div>
            </div>
        </main>`;
}
function moveTo(pid, zi) {
    if (String(pid) === mv.pid && zi === mv.zi) { toast('원래 기록된 칸이에요 · 다른 칸을 눌러 주세요'); return; }
    mv.to = { pid: String(pid), zi }; mv.view = String(pid); paintMove();
}
function doMove() {
    if (!mv || !mv.to) return;
    const fromP = photoById(mv.pid), fz = fromP.zones[mv.zi], toP = photoById(mv.to.pid), tz = toP && toP.zones[mv.to.zi], name = mv.name;
    const it = fz && fz.items.find(x => x.name === name); if (!it || !tz) return;
    const idx = fz.items.indexOf(it), dup = tz.items.find(x => x.name === name), copy = { ...it }, prevChecked = tz.checkedAt;
    fz.items.splice(idx, 1);
    if (!dup) tz.items.push(copy); // 옮긴 칸에 같은 이름이 이미 있으면 하나로 (v1과 같다)
    tz.checkedAt = Date.now();
    saveAll();
    const back = { pid: mv.pid, zi: mv.zi, q: mv.q }, toZi = mv.to.zi;
    backThen(resultHash(toP.id, toZi, '', name, 'move'));
    toast(`옮겼어요 · ${toP.title || '사진'} ${toZi + 1}번`, () => {
        if (!dup) tz.items = tz.items.filter(x => x !== copy);
        if (!fz.items.some(x => x.name === name)) fz.items.splice(Math.min(idx, fz.items.length), 0, it);
        if (prevChecked == null) delete tz.checkedAt; else tz.checkedAt = prevChecked;
        saveAll(); nav(resultHash(back.pid, back.zi, back.q, name, 'search'), true); toast('되돌렸어요');
    });
}
function openLostSheet() {
    const sh = $('#sheet');
    sh.innerHTML = `<div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="shT">
        <h2 id="shT">${esc(josa(mv.name, '을', '를'))} 못 찾으셨어요?</h2>
        <p>지도에서 빼서 ‘자리 미정’에 넣어 둘까요? 나중에 찾으면 그때 자리를 정하면 돼요.</p>
        <div class="stack"><button type="button" class="btn btn-p" data-act="lostYes">자리 미정으로 빼기</button><button type="button" class="btn btn-s" data-act="sheetClose">그대로 두기</button></div></div>`;
    sh.hidden = false; setTimeout(() => { const b = sh.querySelector('.btn'); if (b) b.focus(); }, 30);
}
function closeSheet() { $('#sheet').hidden = true; $('#sheet').innerHTML = ''; }
function doLost() {
    const p = photoById(mv.pid), z = p.zones[mv.zi], idx = z.items.findIndex(x => x.name === mv.name); if (idx < 0) return;
    const it = z.items.splice(idx, 1)[0], had = inboxItems().some(x => x.name === it.name);
    if (!had) kvSet('inboxItems', JSON.stringify([{ name: it.name, at: Date.now() }, ...readJSON('inboxItems', [])])); // v1 자리 미정과 같은 모양
    saveAll(); closeSheet();
    goHome();
    toast(`‘${it.name}’ → 자리 미정`, () => {
        z.items.splice(Math.min(idx, z.items.length), 0, it);
        if (!had) kvSet('inboxItems', JSON.stringify(readJSON('inboxItems', []).filter(x => x && x.name !== it.name)));
        saveAll(); route(true); toast('되돌렸어요');
    });
}

// ────────────────────────────────────────────────────────────
// B8 메뉴 · B1 첫 소개
// ────────────────────────────────────────────────────────────
const FEEDBACK_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSeasXUyRCQNDvlBqHDo4SbQMsNkBpBaHqFqL6aWU091yDmpLw/viewform';

    const has = vis().length > 0;
    const M = [
        ['전체 화면으로', '공간 보기 · 물건 넣기 · 고치기', V1(), 1],
        has && ['물건 전체 목록', '한눈에 훑어보기', '#/list', 0],
        ['자리 미정', '새로 산 물건 넣어 두고 자리 추천받기', V1('inbox'), 1],
        ['번호 스티커 · 지도 인쇄', '사진 지도 · 큰 글씨 목록 · 점검표', V1('print'), 1],
        SAMPLE ? ['예시 닫기', ls('hasSavedPhotos') === '1' ? '내 지도로 돌아가요' : '처음 화면으로', null, 0, 'sampleExit'] : ['예시 보기', '내 지도는 그대로 있어요', null, 0, 'sample'],
        ['가격 · 대신 만들기', '앱은 무료 · 원격·방문 · 업체 샘플 무료', '../price/', 2],
        ['사용법', '처음 쓰는 분을 위한 네 단계', V1('guide'), 1],
        ['설정', '백업 · 기능 켜기', V1('settings'), 1]
    ].filter(Boolean);
    $('#s-menu').innerHTML = `
        <header class="top"><span class="brand">오브젯도</span><button type="button" class="tlink" data-act="back" data-fb="#/">닫기</button></header>
        <main class="wrap" style="flex:1">
            <ul class="menu">${M.map(([t, s, href, ext, act], i) => {
                const inner = `<span class="no">${String(i + 1).padStart(2, '0')}</span><span class="tx"><b>${t}</b><small>${s}</small></span><span class="ar">${ext === 1 ? EXT : '→'}</span>`;
                return `<li>${act ? `<button type="button" class="mi" data-act="${act}">${inner}</button>`
                    : ext === 1 ? `<a class="mi" href="${href}" data-v1>${inner}</a>`
                    : ext === 2 ? `<a class="mi" href="${href}">${inner}</a>`
                    : `<button type="button" class="mi" data-act="go" data-to="${href}">${inner}</button>`}</li>`;
            }).join('')}</ul>
        </main>
        <footer class="foot"><a href="${FEEDBACK_FORM_URL}" target="_blank" rel="noopener">써 보니 어떠세요? 의견 보내기 (1분)</a><br><span style="display:block;margin-top:10px">무료 베타 · 가입 없이 이 폰에만 저장돼요<br>${EXT} 표시는 이전 화면(지금 쓰는 앱)에서 열려요</span></footer>`;
}
function renderIntro() {
    const home = isHome();
    const pts = home ? ['사진 위에 물건 위치 기록', '말로 물으면 그 칸이 보여요', '가족 누구나 같은 지도로', '지도 출력해 수납장에 부착'] : ['사진 위에 물건 위치 기록', '말·검색으로 보관 칸 찾기', '수량·유통기한 점검', '지도 출력해 현장에 부착'];
    $('#s-intro').innerHTML = `
        <header class="top"><span class="brand">오브젯도 <small>OBJETDO</small></span><a class="tlink" href="${V1('guide')}" data-v1>사용법</a></header>
        <main class="intro wrap">
            <span class="kick">무료 베타</span>
            <div class="intro-hero"><h1>물건은 제자리에,<br>찾는 시간은<br>줄이세요</h1><span class="vert" aria-hidden="true">제자리 지도</span></div>
            <p class="lead">사진으로 기록하는<br>${home ? '우리 집 수납 지도' : '매장 창고·수납 관리'}</p>
            <ol class="nums">${pts.map((t, i) => `<li><span>${String(i + 1).padStart(2, '0')}</span>${t}</li>`).join('')}</ol>
            <div class="cta">
                <button type="button" class="btn btn-p split" data-act="sample">예시로 먼저 둘러보기<span aria-hidden="true">→</span></button>
                <a class="btn btn-s split" href="${V1()}" data-v1>${home ? '내 수납장 사진으로 시작' : '내 창고 사진으로 시작'}${EXT}</a>
                <p class="fine">가입 없이 이 폰에만 저장돼요. 사진 넣기는 지금 쓰는 화면(이전 화면)에서 해요.<br>지도 대신 만들기 · 원격 3곳 ₩19,000부터 · <a href="../price/">문의</a></p>
            </div>

}
function enterSample() {
    try { sessionStorage.setItem('samplePreview', isHome() ? 'organizer' : '1'); } catch (e) { toast('이 브라우저에선 예시를 열 수 없어요'); return; }
    history.replaceState(null, '', location.pathname + '#/'); location.reload();
}
function exitSample() {
    try { sessionStorage.removeItem('samplePreview'); } catch (e) {}
    history.replaceState(null, '', location.pathname + '#/'); location.reload();
}

// ────────────────────────────────────────────────────────────
// 누르기: 버튼마다 data-act 하나로
// ────────────────────────────────────────────────────────────
const ACT = {
    back: (el) => goBack(el.dataset.fb),
    go: (el) => nav(el.dataset.to),
    home: () => goHome(),
    clear: () => { const q = $('#q'); q.value = ''; renderLive(); q.focus(); },
    voice: () => startVoiceFromHome(),
    vtoggle: () => { if (voice.rec) voice.stop(); else if (voice.start()) paintVoice(); else { voice.st = 'broken'; paintVoice(); } },
    vtext: () => { nav('#/', true); setTimeout(() => { const q = $('#q'); if (q) q.focus(); }, 60); },
    open: (el) => { const q = el.dataset.q || ''; recordPick(q, el.dataset.item); nav(resultHash(el.dataset.p, +el.dataset.z, q, el.dataset.item, cur === 'r' && rc ? rc.from : 'search'), cur === 'r'); },
    chip: (el) => openQuery(el.dataset.q, 'search'),
    yes: () => actYes(),
    moveStart: () => { if (rc && rc.it) nav(`#/move/${encodeURIComponent(rc.p.id)}/${rc.zi}?` + new URLSearchParams({ item: rc.it.name, ...(rc.q ? { q: rc.q } : {}) })); },
    zoom: () => toggleZoom(),
    zone: (el) => nav(resultHash(el.dataset.p, +el.dataset.z, '', '', 'map')),
    mapTab: (el) => nav(`#/map/${encodeURIComponent(el.dataset.p)}`, true),
    mapMore: (el) => { mapOpen.add(el.dataset.p); route(true); },
    item: (el) => nav(resultHash(el.dataset.p, +el.dataset.z, '', el.dataset.item, 'list')),
    listTab: (el) => nav('#/list' + (el.dataset.by === 'zone' ? '?by=zone' : ''), true),
    mvPick: (el) => moveTo(el.dataset.p, +el.dataset.z),
    mvView: (el) => { mv.view = el.dataset.p; paintMove(); },
    mvList: () => { mv.list = !mv.list; paintMove(); },
    mvGo: () => doMove(),
    mvLost: () => openLostSheet(),
    lostYes: () => doLost(),
    sheetClose: () => closeSheet(),
    sample: () => enterSample(),
    sampleExit: () => exitSample(),
    undo: () => { const f = toastUndo; hideToast(); if (f) f(); }
};
document.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-v1]');
    if (a && !e.defaultPrevented && e.button === 0 && !e.metaKey && !e.ctrlKey) { // 이전 화면으로 가기 전에 쓰던 저장을 끝낸다
        e.preventDefault(); const href = a.href;
        Promise.resolve(store.pending).catch(() => {}).then(() => { location.href = href; });
        return;
    }
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const f = ACT[el.dataset.act]; if (!f) return;
    e.preventDefault(); f(el, e);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
$('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') closeSheet(); });

(async function boot() {
    try { history.scrollRestoration = 'manual'; history.replaceState(history.state && history.state.v2 != null ? history.state : { v2: 0 }, '', location.hash || '#/'); } catch (e) {}
    try { await loadAll(); ready = true; route(true); }
    catch (e) { $('#boot').innerHTML = `불러오지 못했어요 · <a href="../">이전 화면으로</a>`; }
})();
</script>
