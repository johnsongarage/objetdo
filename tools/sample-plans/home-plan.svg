<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <!-- 오브젯도 v2 예시: 집 배치도 (위에서 본 모습). 가구 네모 위치는 tools/v2_samples.py의 HOME_PLAN_ZONES와 같다 -->
  <rect width="800" height="560" fill="#FBF8F3"/>
  <rect x="20" y="20" width="760" height="520" fill="#F3EEE5"/>
  <rect x="20" y="20" width="310" height="230" fill="#EFE7DA"/>
  <rect x="330" y="20" width="140" height="150" fill="#E4EBEE"/>
  <rect x="470" y="20" width="310" height="210" fill="#EDE6DA"/>
  <rect x="650" y="420" width="130" height="120" fill="#E7E0D4"/>
  <g stroke="#E3DACC" stroke-width="1"><path d="M20 300H650M20 360H650M20 420H650M20 480H650"/></g>
  <!-- 안방: 붙박이장(위 벽), 침대 -->
  <rect x="40" y="30" width="260" height="50" rx="2" fill="#DCCDB6" stroke="#7C7266" stroke-width="2.5"/>
  <path d="M105 30V80M170 30V80M235 30V80" stroke="#7C7266" stroke-width="1.5"/>
  <rect x="110" y="112" width="150" height="118" rx="6" fill="#F7F3EC" stroke="#B9AE9F" stroke-width="2"/>
  <rect x="120" y="120" width="60" height="26" rx="5" fill="#EDE6DA" stroke="#B9AE9F" stroke-width="1.5"/><rect x="190" y="120" width="60" height="26" rx="5" fill="#EDE6DA" stroke="#B9AE9F" stroke-width="1.5"/>
  <!-- 욕실 -->
  <rect x="345" y="34" width="110" height="52" rx="14" fill="#F7FAFB" stroke="#9AAAB2" stroke-width="2"/>
  <!-- 주방 -->
  <rect x="490" y="30" width="276" height="44" rx="2" fill="#E3D6C3" stroke="#B9AE9F" stroke-width="2"/>
  <rect x="560" y="120" width="140" height="70" rx="4" fill="#E6DCCD" stroke="#B9AE9F" stroke-width="2"/>
  <!-- 거실: 수납장(왼쪽 벽), 소파, 탁자, TV 아래 서랍 -->
  <rect x="40" y="300" width="60" height="170" rx="2" fill="#DCCDB6" stroke="#7C7266" stroke-width="2.5"/>
  <path d="M40 357H100M40 413H100" stroke="#7C7266" stroke-width="1.5"/>
  <rect x="300" y="282" width="250" height="56" rx="10" fill="#E6DCCD" stroke="#B9AE9F" stroke-width="2"/>
  <rect x="350" y="380" width="150" height="56" rx="6" fill="#F7F3EC" stroke="#B9AE9F" stroke-width="2"/>
  <rect x="300" y="488" width="160" height="40" rx="2" fill="#DCCDB6" stroke="#7C7266" stroke-width="2.5"/>
  <path d="M353 488V528M407 488V528" stroke="#7C7266" stroke-width="1.5"/>
  <rect x="320" y="528" width="120" height="8" fill="#3A3530"/>
  <!-- 벽·문 -->
  <path d="M780 420V20H20V540H780V500" fill="none" stroke="#3A3530" stroke-width="8"/>
  <path d="M330 20V250H200M120 250H20M330 170H470M470 20V230H560M640 230H780M650 420V540M650 420H700" fill="none" stroke="#3A3530" stroke-width="6"/>
  <path d="M780 420V500" stroke="#9E3B2A" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- 이름 -->
  <g fill="#8C8378" font-size="22" font-weight="700" letter-spacing="2">
    <text x="40" y="215">안방</text><text x="370" y="140">욕실</text><text x="600" y="215">주방</text><text x="160" y="400">거실</text>
  </g>
  <text x="684" y="490" fill="#9E3B2A" font-size="17" font-weight="700">현관</text>
</svg>
